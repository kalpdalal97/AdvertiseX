<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Look Book — Deep Sons</title>
<meta name="description" content="Browse Deep Sons by section: suiting, shirting, wedding designer sherwani, indo-western, kurta jacket sets, jodhpuri and customized tailoring.">
<meta name="theme-color" content="#fbf6ec">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="has-bar">

<header class="head" data-header></header>

<main data-collection>

  <section class="panel" style="padding:34px 0 22px">
    <div class="wrap">
      <div class="panel__head" data-sect-head style="margin-bottom:0"></div>
    </div>
  </section>

  <div style="border-bottom:1px solid var(--line)">
    <div class="chips" data-chips></div>
  </div>

  <p class="count" data-count></p>

  <div class="wrap" style="padding:0">
    <div class="grid" data-grid></div>
  </div>

  <section class="panel">
    <div class="wrap">
      <p class="note">Photographs are shown for reference only. Every piece is made
        to order, so cloth, motif and finish are confirmed with you in the shop —
        we do not publish prices online.</p>
    </div>
  </section>

  <nav class="bar" aria-label="Sort and filter">
    <button data-sheet="sort">
      <span><small>Sort by</small><b data-sort-label>Hand-picked</b></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4v16M7 20l-3-3M7 4l3 3M17 20V4M17 4l-3 3M17 20l3-3"/></svg>
    </button>
    <i class="bar__sep"></i>
    <button data-sheet="filter">
      <span><small>Filter</small><b data-filter-label>Apply filter</b></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 5h18M6 12h12M10 19h4"/></svg>
      <i class="bar__dot" data-filter-dot hidden></i>
    </button>
    <i class="bar__sep"></i>
    <div class="bar__views">
      <button class="bar__view" data-view="1" aria-label="One per row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="1"/></svg>
      </button>
      <button class="bar__view is-on" data-view="2" aria-label="Two per row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="8" height="16" rx="1"/><rect x="13" y="4" width="8" height="16" rx="1"/></svg>
      </button>
    </div>
  </nav>

</main>

<footer class="foot" data-footer></footer>

<script src="assets/js/catalogue.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>

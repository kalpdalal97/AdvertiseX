<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lookbook — Deep Sons</title>
<meta name="description" content="The Deep Sons lookbook — wedding sherwanis, indo-western, kurta jacket sets, jodhpuris, suiting and shirting, in pictures.">
<meta name="theme-color" content="#fbf6ec">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<header class="head" data-header></header>

<section class="bookhead">
  <div class="wrap">
    <p class="kicker">Lookbook</p>
    <h1>Everything, in pictures</h1>
    <p>Pick an occasion, or scroll the lot. Tap any picture to see it larger.</p>
  </div>
</section>

<div class="bookbar">
  <div class="wrap bookbar__in">
    <div class="bookbar__chips" data-book-chips></div>
    <button class="bookbar__clear" data-book-clear hidden>Clear all</button>
    <span class="bookbar__count" data-book-count></span>
    <div class="bookbar__views">
      <button class="bookbar__view is-on" data-book-view="3" aria-label="Three per row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="13" y="3" width="8" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg>
      </button>
      <button class="bookbar__view" data-book-view="5" aria-label="Five per row">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1"/><rect x="17" y="3" width="5" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1"/><rect x="10" y="10" width="5" height="5" rx="1"/><rect x="17" y="10" width="5" height="5" rx="1"/><rect x="3" y="17" width="5" height="5" rx="1"/><rect x="10" y="17" width="5" height="5" rx="1"/><rect x="17" y="17" width="5" height="5" rx="1"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="lookbook" data-lookbook></div>

<section class="panel">
  <div class="wrap" style="text-align:center">
    <a class="btn btn--ink" href="collection.html?c=all">Browse by section instead</a>
  </div>
</section>

<footer class="foot" data-footer></footer>

<script src="assets/js/catalogue.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
